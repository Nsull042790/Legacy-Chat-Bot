# Deploy to GitHub Pages using GitHub Actions
name: Deploy to GitHub Pages

on:
  # Runs on pushes to main or the current feature branch
  push:
    branches: ['main', 'claude/mortgage-chatbot-github-pages-WJPKY']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './luminate-mortgage-chatbot/package-lock.json'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci
        working-directory: ./luminate-mortgage-chatbot

      - name: Build
        run: npm run build
        working-directory: ./luminate-mortgage-chatbot

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './luminate-mortgage-chatbot/dist'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
